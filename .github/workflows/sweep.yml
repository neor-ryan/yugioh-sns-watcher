name: 通常監視（毎時）

on:
  schedule:
    - cron: "17 * * * *" # 毎時17分（00分は混むので避ける）。集中監視の時間帯はスクリプト側でスキップ
  workflow_dispatch:

concurrency:
  group: watcher-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 通常監視
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py --mode sweep
      - name: 状態ファイルをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "chore: update state [skip ci]"
          git pull --rebase
          git push
