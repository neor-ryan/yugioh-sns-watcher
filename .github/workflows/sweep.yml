name: 通常監視（毎時）

on:
  schedule:
    - cron: "17 * * * *" # 毎時17分（00分は混むので避ける）。集中監視の時間帯はスクリプト側でスキップ
  workflow_dispatch:
    inputs:
      promo_now:
        description: "過去動画の宣伝を今すぐ1本出す"
        type: boolean
        default: false

concurrency:
  group: watcher-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 通常監視
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PROMO_WEBHOOK_URL: ${{ secrets.DISCORD_PROMO_WEBHOOK_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PROMO_NOW: ${{ inputs.promo_now }}
        run: |
          if [ "$PROMO_NOW" = "true" ]; then python src/main.py --mode promo; else python src/main.py --mode sweep; fi
      - name: 状態ファイルをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "chore: update state"
          git pull --rebase
          git push
