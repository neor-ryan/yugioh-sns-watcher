name: 集中監視（12時・21時）

on:
  schedule:
    - cron: "50 2 * * *" # JST 11:50
    - cron: "50 11 * * *" # JST 20:50
  workflow_dispatch:
    inputs:
      minutes:
        description: "継続時間（分）。空なら時間帯の終わりまで"
        required: false

concurrency:
  group: watcher-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 集中監視
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MINUTES: ${{ inputs.minutes }}
        run: python src/main.py --mode window ${MINUTES:+--minutes "$MINUTES"}
      - name: 状態ファイルをコミット
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/state.json
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -m "chore: update state [skip ci]"
          git pull --rebase
          git push
